[workspace]
members = ["crates/lcm-core", "crates/lcm-algorithms", "crates/lcm-cli", "crates/lcm-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/drdebmath/LCMmodel"

[workspace.dependencies]
lcm-core = { path = "crates/lcm-core" }
lcm-algorithms = { path = "crates/lcm-algorithms" }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
